# Isolated B7 harness. No published ports, shared application networks or data volumes.
x-client: &client
  image: ${TRUST_PHP_IMAGE:-shopkmp-php-tests}
  command: [sleep, infinity]
  cap_drop: [NET_RAW]

x-sdui: &sdui
  build: ../../../backend-sdui
  image: shopkmp-b7-trust-sdui
  cap_drop: [NET_RAW]
  environment:
    YII_ORIGIN: http://yii2-http:8080
    TRUSTED_EDGE_IPS: 10.247.249.2

services:
  yii2:
    image: ${TRUST_PHP_IMAGE:-shopkmp-php-tests}
    cap_drop: [NET_RAW]
    environment:
      DATABASE_URL: ${TRUST_DATABASE_URL:?isolated trust_ database required}
      TRUSTED_BFF_IPS: 10.247.249.4,10.247.249.5
      FPM_TRUSTED_NGINX_IPS: 10.246.249.3,127.0.0.1
      READ_RATE_LIMIT: "4"
      AUTHENTICATED_NETWORK_RATE_LIMIT_MULTIPLIER: "2"
      RATE_LIMIT_WINDOW: 1m
      PAYMENT_WEBHOOK_SECRET: trust-live-test-only
      PAYMENT_WEBHOOK_ALLOWED_CIDRS: 10.248.11.10/32
    volumes:
      - ../../infrastructure/Network.php:/app/infrastructure/Network.php:ro
      - ./fpm.conf:/usr/local/etc/php-fpm.d/zz-trust.conf:ro
    networks:
      fpm: {ipv4_address: 10.246.249.4}
      database:
  yii2-http:
    image: nginx:1.27-alpine
    cap_drop: [NET_RAW]
    environment:
      EDGE_IP: 10.247.249.2
      NGINX_ENVSUBST_FILTER: EDGE_IP
    volumes:
      - ../../../deploy/nginx/yii2.conf.template:/etc/nginx/templates/default.conf.template:ro
    networks:
      ingress: {ipv4_address: 10.247.249.3}
      fpm: {ipv4_address: 10.246.249.3}
  sdui:
    <<: *sdui
    networks:
      ingress: {ipv4_address: 10.247.249.4}
  sdui-2:
    <<: *sdui
    networks:
      ingress: {ipv4_address: 10.247.249.5, aliases: [sdui]}
  edge:
    image: nginx:1.27-alpine
    cap_drop: [NET_RAW]
    volumes:
      - ./edge.conf:/etc/nginx/conf.d/default.conf:ro
      - ../../../deploy/nginx/routes.conf:/etc/nginx/routes.conf:ro
      - ../../../deploy/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
    networks:
      ingress: {ipv4_address: 10.247.249.2}
      clients: {ipv4_address: 10.248.0.2, ipv6_address: 'fd07:bb7::2'}
  client-a:
    <<: *client
    networks:
      clients: {ipv4_address: 10.248.11.10, ipv6_address: 'fd07:bb7:0:11::10'}
  client-b:
    <<: *client
    networks:
      clients: {ipv4_address: 10.248.12.10, ipv6_address: 'fd07:bb7:0:12::10'}
  client-neighbor:
    <<: *client
    networks:
      clients: {ipv4_address: 10.248.11.11, ipv6_address: 'fd07:bb7:0:11::11'}
  untrusted:
    <<: *client
    networks:
      ingress: {ipv4_address: 10.247.249.99}
      database:

networks:
  ingress:
    internal: true
    ipam: {config: [{subnet: 10.247.249.0/24}]}
  fpm:
    internal: true
    ipam: {config: [{subnet: 10.246.249.0/24}]}
  clients:
    enable_ipv6: true
    internal: true
    ipam:
      config: [{subnet: 10.248.0.0/16}, {subnet: 'fd07:bb7::/48'}]
  database:
    external: true
    name: ${TRUST_DB_NETWORK:-shopkmp-backend-fixes-20261026}
