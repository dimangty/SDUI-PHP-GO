server {
    listen 8080;
    server_name _;
    root /app/web;
    client_max_body_size 6m;
    client_body_timeout 15s;
    error_page 413 = @too_large;
    location @too_large {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"request body exceeds the configured limit","traceId":"$request_id"}}';
    }
    location / {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/web/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass yii2:9000;
        fastcgi_read_timeout 30s;
        fastcgi_hide_header X-Powered-By;
    }
}
