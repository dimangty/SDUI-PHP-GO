    TokenResponse:
      type: object
      required: [userId, accessToken, refreshToken, expiresIn]
      properties:
        userId: {type: string, format: uuid}
        accessToken: {type: string}
        refreshToken: {type: string}
        expiresIn: {type: integer, minimum: 1}
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, fullName, phone]
      properties:
        email: {type: string, format: email, maxLength: 254}
        password: {type: string, format: password, minLength: 8, maxLength: 128}
        fullName: {type: string, minLength: 1, maxLength: 255}
        phone: {type: string, minLength: 9, maxLength: 16}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, format: password}
    RefreshRequest:
      type: object
      additionalProperties: false
      required: [refreshToken]
      properties: {refreshToken: {type: string}}
    LogoutRequest:
      type: object
      additionalProperties: false
      properties:
        refreshToken: {type: [string, 'null']}
    PinLoginRequest:
      type: object
      additionalProperties: false
      required: [deviceId, pin]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 255}
        pin: {type: string, pattern: '^[0-9]{4,6}$'}
    SetPinRequest:
      type: object
      additionalProperties: false
      required: [deviceId, deviceName, pin]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 255}
        deviceName: {type: string, minLength: 1, maxLength: 255}
        pin: {type: string, pattern: '^[0-9]{4,6}$'}
    ChangePinRequest:
      type: object
      additionalProperties: false
      required: [deviceId, currentPin, newPin]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 255}
        currentPin: {type: string, pattern: '^[0-9]{4,6}$'}
        newPin: {type: string, pattern: '^[0-9]{4,6}$'}
    BiometricEnrollRequest:
      type: object
      additionalProperties: false
      required: [deviceId, deviceName, publicKey, keyAlgorithm]
      properties:
        deviceId: {type: string, minLength: 1, maxLength: 255}
        deviceName: {type: string, minLength: 1, maxLength: 255}
        publicKey: {type: string, minLength: 1, maxLength: 16384, description: Base64 or PEM SPKI public key.}
        keyAlgorithm: {type: string, enum: [ES256, EdDSA]}
    BiometricEnrollResponse:
      type: object
      additionalProperties: false
      required: [credentialId]
      properties:
        credentialId: {type: string, format: uuid}
    BiometricChallengeRequest:
      type: object
      additionalProperties: false
      required: [credentialId]
      properties: {credentialId: {type: string, format: uuid}}
    BiometricChallengeResponse:
      type: object
      required: [challenge, expiresIn]
      properties:
        challenge: {type: string}
        expiresIn: {type: integer, minimum: 1}
    BiometricLoginRequest:
      type: object
      additionalProperties: false
      required: [credentialId, challenge, signature]
      properties:
        credentialId: {type: string, format: uuid}
        challenge: {type: string}
        signature: {type: string, description: Base64 DER ECDSA or raw Ed25519 signature.}
    User:
      type: object
      required: [id, email, fullName, phone, avatarUrl, defaultAddressId, dateOfBirth, createdAt]
      properties:
        id: {type: string, format: uuid}
        email: {type: string, format: email}
        fullName: {type: string}
        phone: {type: string}
        avatarUrl: {type: [string, 'null']}
        defaultAddressId: {type: [string, 'null'], format: uuid}
        dateOfBirth: {type: [string, 'null'], format: date-time}
        createdAt: {type: string, format: date-time}
    SessionResponse:
      type: object
      required: [user, device, cartItemsCount]
      properties:
        user: {$ref: '#/components/schemas/User'}
        device: {$ref: '#/components/schemas/DeviceSession'}
        cartItemsCount: {type: integer, minimum: 0}
    DeviceSession:
      type: object
      required: [pinEnabled, biometricEnabled]
      properties:
        pinEnabled: {type: boolean}
        biometricEnabled: {type: boolean}
        biometricCredentialId: {type: [string, 'null'], format: uuid, description: Present for authenticated migration and quick-login setup.}
    Category:
      type: object
      required: [id, name, parentId, iconUrl, sortOrder]
      properties:
        id: {type: string, format: uuid}
        name: {type: string}
        parentId: {type: [string, 'null'], format: uuid}
        iconUrl: {type: string}
        sortOrder: {type: integer}
    AddCartItemRequest:
      type: object
      additionalProperties: false
      required: [productId, quantity]
      properties:
        productId: {type: string, format: uuid}
        quantity: {type: integer, minimum: 1}
    UpdateCartItemRequest:
      type: object
      additionalProperties: false
      required: [quantity]
      properties: {quantity: {type: integer, minimum: 0}}
    CartItem:
      type: object
      required: [productId, productName, quantity, priceSnapshot, imageUrl, isAvailable, stock]
      properties:
        productId: {type: string, format: uuid}
        productName: {type: string}
        quantity: {type: integer, minimum: 1}
        priceSnapshot: {$ref: '#/components/schemas/Money'}
        imageUrl: {type: [string, 'null']}
        isAvailable: {type: boolean}
        stock: {type: integer, minimum: 0}
    Cart:
      type: object
      required: [id, userId, items, totalAmount, updatedAt]
      properties:
        id: {type: string}
        userId: {type: string, format: uuid}
        items: {type: array, items: {$ref: '#/components/schemas/CartItem'}}
        totalAmount: {$ref: '#/components/schemas/Money'}
        updatedAt: {type: string, format: date-time}
    AddressInput:
      type: object
      additionalProperties: false
      required: [city, street, house]
      properties:
        city: {type: string, minLength: 1, maxLength: 255}
        street: {type: string, minLength: 1, maxLength: 255}
        house: {type: string, minLength: 1, maxLength: 64}
        apartment: {type: string, maxLength: 64}
        comment: {type: [string, 'null'], maxLength: 2000}
    Address:
      type: object
      required: [id, userId, city, street, house, apartment, comment]
      properties:
        id: {type: string, format: uuid}
        userId: {type: string, format: uuid}
        city: {type: string}
        street: {type: string}
        house: {type: string}
        apartment: {type: string}
        comment: {type: [string, 'null']}
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [deliveryAddressId, paymentMethod]
      properties:
        deliveryAddressId: {type: string, format: uuid}
        paymentMethod: {type: string, enum: [CARD, SBP, ON_DELIVERY]}
        comment: {type: [string, 'null'], maxLength: 2000}
    OrderItem:
      type: object
      required: [productId, productName, quantity, priceSnapshot]
      properties:
        productId: {type: string, format: uuid}
        productName: {type: string}
        quantity: {type: integer, minimum: 1}
        priceSnapshot: {$ref: '#/components/schemas/Money'}
    Order:
      type: object
      required: [id, number, userId, status, items, totalAmount, deliveryAddressId, deliveryAddress, paymentId, paymentMethod, createdAt, comment]
      properties:
        id: {type: string, format: uuid}
        number: {type: integer}
        userId: {type: string, format: uuid}
        status: {type: string, enum: [CREATED, PAID, ASSEMBLING, DELIVERING, COMPLETED, CANCELLED]}
        items: {type: array, items: {$ref: '#/components/schemas/OrderItem'}}
        totalAmount: {$ref: '#/components/schemas/Money'}
        deliveryAddressId: {type: string, format: uuid}
        deliveryAddress: {type: string}
        paymentId: {type: [string, 'null'], format: uuid}
        paymentMethod: {type: string, enum: [CARD, SBP, ON_DELIVERY]}
        createdAt: {type: string, format: date-time}
        comment: {type: [string, 'null']}
    OrderPage:
      type: object
      required: [items, page, size, totalPages, totalItems]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Order'}}
        page: {type: integer, minimum: 0}
        size: {type: integer, minimum: 1}
        totalPages: {type: integer, minimum: 0}
        totalItems: {type: integer, minimum: 0}
    Payment:
      type: object
      required: [id, orderId, method, status, amount, transactionId]
      properties:
        id: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        method: {type: string, enum: [CARD, SBP, ON_DELIVERY]}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        amount: {$ref: '#/components/schemas/Money'}
        transactionId: {type: [string, 'null']}
    PaymentConfirmation:
      type: object
      required: [paymentId, status, paymentUrl]
      properties:
        paymentId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/PaymentStatus'}
        paymentUrl: {type: [string, 'null'], format: uri}
    CreateReviewRequest:
      type: object
      additionalProperties: false
      required: [rating, text]
      properties:
        rating: {type: integer, minimum: 1, maximum: 5}
        text: {type: string, minLength: 1, maxLength: 2000}
    Review:
