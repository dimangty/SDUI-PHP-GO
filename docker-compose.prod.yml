# Docker Compose >=2.24.4 (!override). Only the edge's TLS port is published.
x-production-env: &production-env
  APP_ENV: production
  PGSSLROOTCERT: /run/tls/ca.crt

x-production-volumes: &production-volumes
  - ${TLS_CERT_DIR:?required}/ca.crt:/run/tls/ca.crt:ro
  - ${CA_BUNDLE_FILE:?required}:/run/tls/ca-bundle.crt:ro
  - ./deploy/php/tls.ini:/usr/local/etc/php/conf.d/zz-tls.ini:ro

services:
  postgres:
    entrypoint: [/bin/sh, /opt/postgres-tls.sh]
    volumes:
      - ./deploy/postgres-tls.sh:/opt/postgres-tls.sh:ro
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
      - ${TLS_CERT_DIR}/postgres.crt:/run/tls/server.crt:ro
      - ${TLS_CERT_DIR}/postgres.key:/run/tls/server.key:ro
      - ./deploy/pg_hba.conf:/run/tls/pg_hba.conf:ro
  migrate:
    environment:
      DATABASE_URL: postgres://shopkmp_owner@postgres:5432/shopkmp?sslmode=verify-full&sslrootcert=/run/tls/ca.crt
      PGPASSWORD: ${POSTGRES_OWNER_PASSWORD:?migration secret required}
    volumes: ["${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro"]
  yii-migrate:
    environment:
      <<: *production-env
      DATABASE_URL: postgres://shopkmp_owner:${POSTGRES_OWNER_PASSWORD:?migration secret required}@postgres:5432/shopkmp?sslmode=verify-full
      DATABASE_ROLE: owner
    volumes: *production-volumes
  reindex:
    # Remains in config for the required SQL-role/artifact gates; only an explicit
    # `compose run reindex` starts this one-shot privileged indexer in production.
    scale: 0
    environment:
      <<: *production-env
      DATABASE_URL: postgres://shopkmp_indexer:${POSTGRES_INDEXER_PASSWORD:?index bootstrap secret required}@postgres:5432/shopkmp?sslmode=verify-full
      DATABASE_ROLE: indexer
      OPENSEARCH_URL: https://shopkmp_indexer:${OPENSEARCH_INDEXER_PASSWORD:?index lifecycle secret required}@opensearch:9200
    volumes: *production-volumes
  yii2:
    environment:
      <<: *production-env
      DATABASE_URL: postgres://shopkmp_runtime:${POSTGRES_RUNTIME_PASSWORD:?runtime secret required}@postgres:5432/shopkmp?sslmode=verify-full
      DATABASE_ROLE: runtime
      OPENSEARCH_URL: https://shopkmp_runtime:${OPENSEARCH_RUNTIME_PASSWORD:?runtime search secret required}@opensearch:9200
      PAYMENT_GATEWAY_URL: ${PAYMENT_GATEWAY_URL:?required HTTPS provider}
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:?required}
      PAYMENT_WEBHOOK_ALLOWED_CIDRS: ${PAYMENT_WEBHOOK_ALLOWED_CIDRS:?required}
    volumes:
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
      - ${CA_BUNDLE_FILE}:/run/tls/ca-bundle.crt:ro
      - ./deploy/php/tls.ini:/usr/local/etc/php/conf.d/zz-tls.ini:ro
  maintenance:
    environment:
      <<: *production-env
      DATABASE_URL: postgres://shopkmp_maintenance:${POSTGRES_MAINTENANCE_PASSWORD:?maintenance secret required}@postgres:5432/shopkmp?sslmode=verify-full
      DATABASE_ROLE: maintenance
    volumes:
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
      - ${CA_BUNDLE_FILE}:/run/tls/ca-bundle.crt:ro
      - ./deploy/php/tls.ini:/usr/local/etc/php/conf.d/zz-tls.ini:ro
  reconcile:
    depends_on: !override
      yii2-http: {condition: service_healthy}
    environment:
      <<: *production-env
      DATABASE_URL: postgres://shopkmp_search:${POSTGRES_SEARCH_PASSWORD:?search worker secret required}@postgres:5432/shopkmp?sslmode=verify-full
      DATABASE_ROLE: search
      OPENSEARCH_URL: https://shopkmp_reconcile:${OPENSEARCH_RECONCILE_PASSWORD:?reconciliation secret required}@opensearch:9200
    volumes:
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
      - ${CA_BUNDLE_FILE}:/run/tls/ca-bundle.crt:ro
      - ./deploy/php/tls.ini:/usr/local/etc/php/conf.d/zz-tls.ini:ro
  payment-recovery:
    environment:
      <<: *production-env
      DATABASE_URL: postgres://shopkmp_recovery:${POSTGRES_RECOVERY_PASSWORD:?payment recovery secret required}@postgres:5432/shopkmp?sslmode=verify-full
      DATABASE_ROLE: recovery
      PAYMENT_GATEWAY_URL: ${PAYMENT_GATEWAY_URL:?required HTTPS provider}
      PAYMENT_GATEWAY_API_KEY: ${PAYMENT_GATEWAY_API_KEY:?required}
    volumes: *production-volumes
  seed:
    profiles: !override [development-only]
    environment: !override
      APP_ENV: production
  identity-operator:
    build: ./backend-yii2
    image: ${COMPOSE_PROJECT_NAME:-shopkmp-migrated}-yii2
    profiles: [database-admin]
    command: [php, yii, auth/inventory]
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://shopkmp_identity_operator:${POSTGRES_OPERATOR_PASSWORD:?operator secret required}@postgres:5432/shopkmp?sslmode=verify-full
      DATABASE_ROLE: operator
      PGSSLROOTCERT: /run/tls/ca.crt
    volumes:
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
    networks: [data]
    restart: "no"
    security_opt: [no-new-privileges:true]
  database-provision:
    build: ./backend-yii2
    image: ${COMPOSE_PROJECT_NAME:-shopkmp-migrated}-yii2
    profiles: [database-admin]
    command: [php, /opt/database-provision.php, roles]
    environment:
      DATABASE_URL: postgres://shopkmp:${POSTGRES_PASSWORD:?DBA secret required}@postgres:5432/shopkmp?sslmode=verify-full
      PGSSLROOTCERT: /run/tls/ca.crt
      POSTGRES_OWNER_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?migration secret required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?runtime secret required}
      POSTGRES_OPERATOR_PASSWORD: ${POSTGRES_OPERATOR_PASSWORD:?operator secret required}
      POSTGRES_SEARCH_PASSWORD: ${POSTGRES_SEARCH_PASSWORD:?search worker secret required}
      POSTGRES_INDEXER_PASSWORD: ${POSTGRES_INDEXER_PASSWORD:?index bootstrap secret required}
      POSTGRES_MAINTENANCE_PASSWORD: ${POSTGRES_MAINTENANCE_PASSWORD:?maintenance secret required}
      POSTGRES_RECOVERY_PASSWORD: ${POSTGRES_RECOVERY_PASSWORD:?payment recovery secret required}
    volumes:
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
      - ./deploy/database-provision.php:/opt/database-provision.php:ro
    networks: [data]
    restart: "no"
    security_opt: [no-new-privileges:true]
  opensearch:
    environment:
      DISABLE_SECURITY_PLUGIN: !reset null
      DISABLE_INSTALL_DEMO_CONFIG: "true"
    entrypoint: [bash, /opt/search-start.sh]
    volumes:
      - ./deploy/search-start.sh:/opt/search-start.sh:ro
      - ./deploy/opensearch.yml:/usr/share/opensearch/config/opensearch.yml:ro
      - ${TLS_CERT_DIR}/ca.crt:/usr/share/opensearch/config/certs/ca.crt:ro
      - ${TLS_CERT_DIR}/opensearch.crt:/usr/share/opensearch/config/certs/opensearch.crt:ro
      - ${TLS_CERT_DIR}/opensearch.key:/usr/share/opensearch/config/certs/opensearch.key:ro
    healthcheck:
      # TLS + initialized authentication, with no password or operator key on node.
      test: [CMD-SHELL, 'test "$$(curl -sS --max-time 4 --cacert config/certs/ca.crt -o /dev/null -w "%{http_code}" https://opensearch:9200/)" = 401']
  search-security-bootstrap:
    build:
      context: .
      dockerfile: deploy/opensearch.Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-shopkmp-migrated}-opensearch
    profiles: [search-admin]
    entrypoint: [bash, /opt/search-security-bootstrap.sh]
    volumes:
      - ./deploy/search-security-bootstrap.sh:/opt/search-security-bootstrap.sh:ro
      - ./deploy/search-security:/opt/search-security:ro
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
      - ${TLS_CERT_DIR}/search-admin.crt:/run/tls/search-admin.crt:ro
      - ${TLS_CERT_DIR}/search-admin.key:/run/tls/search-admin.key:ro
    networks: [application]
    restart: "no"
    mem_limit: 512m
    security_opt: [no-new-privileges:true]
  search-security-provision:
    build: ./backend-yii2
    image: ${COMPOSE_PROJECT_NAME:-shopkmp-migrated}-yii2
    profiles: [search-admin]
    entrypoint: [php, /opt/search-security-provision.php]
    command: [check]
    environment:
      OPENSEARCH_PRODUCTS_INDEX: ${OPENSEARCH_PRODUCTS_INDEX:-shopkmp-products}
      OPENSEARCH_RUNTIME_PASSWORD: ${OPENSEARCH_RUNTIME_PASSWORD:?runtime search secret required}
      OPENSEARCH_RECONCILE_PASSWORD: ${OPENSEARCH_RECONCILE_PASSWORD:?reconciliation secret required}
      OPENSEARCH_INDEXER_PASSWORD: ${OPENSEARCH_INDEXER_PASSWORD:?index lifecycle secret required}
    volumes:
      - ./deploy/search-security-provision.php:/opt/search-security-provision.php:ro
      - ./deploy/search-roles.php:/opt/search-roles.php:ro
      - ${TLS_CERT_DIR}/ca.crt:/run/tls/ca.crt:ro
      - ${TLS_CERT_DIR}/search-admin.crt:/run/tls/search-admin.crt:ro
      - ${TLS_CERT_DIR}/search-admin.key:/run/tls/search-admin.key:ro
    networks: [application]
    restart: "no"
    mem_limit: 128m
    security_opt: [no-new-privileges:true]
  edge:
    environment:
      PUBLIC_API_HOST: ${PUBLIC_API_HOST:?required}
      NGINX_ENVSUBST_FILTER: PUBLIC_API_HOST
    volumes: !override
      - ./deploy/nginx/edge.prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./deploy/nginx/routes.conf:/etc/nginx/routes.conf:ro
      - ./deploy/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ${TLS_CERT_DIR}/api.crt:/run/tls/api.crt:ro
      - ${TLS_CERT_DIR}/api.key:/run/tls/api.key:ro
    ports: !override ['${EDGE_BIND:-0.0.0.0}:${EDGE_TLS_PORT:-443}:8443']
