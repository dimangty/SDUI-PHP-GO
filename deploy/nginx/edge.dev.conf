log_format edge '$remote_addr "$request_method $uri" $status $request_time $request_id';
access_log /dev/stdout edge;
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    include /etc/nginx/routes.conf;
    # Development only: unchanged original Go e2e waits on this path.
    location = /health/live { proxy_pass http://yii2-http:8080; }
    location = /health/ready { proxy_pass http://yii2-http:8080; }
    location = /swagger { return 302 /swagger/; }
    location /swagger/ { alias /srv/swagger/; index index.html; }
}
server {
    listen 8090;
    server_name _;
    location = /live { access_log off; return 200 'ok'; }
    location / { return 404; }
}
