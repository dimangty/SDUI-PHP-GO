# Reconstruct a finite header set. Never append client forwarding/identity headers.
proxy_http_version 1.1;
proxy_pass_request_headers off;
proxy_set_header Host $host;
proxy_set_header Authorization $http_authorization;
proxy_set_header Content-Type $http_content_type;
proxy_set_header Accept $http_accept;
proxy_set_header Origin $http_origin;
proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
proxy_set_header Access-Control-Request-Headers $http_access_control_request_headers;
proxy_set_header Idempotency-Key $http_idempotency_key;
proxy_set_header X-Request-Id $request_id;
proxy_set_header X-Real-IP $remote_addr;
# Internal Nginx alone constructs this rate-only FastCGI context. A public
# caller must never supply it, even when it arrives through another proxy.
proxy_set_header X-Shop-Rate-Client-IP "";
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Webhook-Id $http_x_webhook_id;
proxy_set_header X-Webhook-Timestamp $http_x_webhook_timestamp;
proxy_set_header X-Webhook-Signature $http_x_webhook_signature;
proxy_set_header X-Admin-Bootstrap-Token $http_x_admin_bootstrap_token;
proxy_set_header If-None-Match $http_if_none_match;
proxy_set_header Connection "";
proxy_connect_timeout 3s;
proxy_send_timeout 15s;
proxy_read_timeout 35s;
proxy_next_upstream off;
proxy_redirect off;
