client_max_body_size 6m;
client_header_timeout 5s;
client_body_timeout 10s;
send_timeout 15s;
keepalive_timeout 30s;
server_tokens off;
include /etc/nginx/proxy.conf;
resolver 127.0.0.11 valid=5s ipv6=off;
set $sdui_upstream sdui:8080;
set $yii_upstream yii2-http:8080;
error_page 413 = @too_large;
location @too_large {
    default_type application/json;
    add_header Cache-Control no-store always;
    return 413 '{"error":{"code":"REQUEST_TOO_LARGE","message":"request body exceeds the configured limit","traceId":"$request_id"}}';
}
location ^~ /api/v1/screens/ {
    proxy_read_timeout 15s;
    proxy_pass http://$sdui_upstream;
}
location ^~ /api/v1/sdui/ {
    client_max_body_size 32k;
    proxy_read_timeout 15s;
    proxy_pass http://$sdui_upstream;
}
location /api/v1/ { proxy_pass http://$yii_upstream; }
location /uploads/ { proxy_pass http://$yii_upstream; }
location /images/products/ { proxy_pass http://$yii_upstream; }
location /icons/ { proxy_pass http://$yii_upstream; }
location /demo/payments/ { proxy_pass http://$yii_upstream; }
location / { return 404; }
