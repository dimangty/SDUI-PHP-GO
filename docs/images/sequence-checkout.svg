<text x="860.0" y="1164" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">UPDATE payments SET status=CAPTURED; UPDATE</text>
<text x="860.0" y="1179" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">orders SET status=PAID</text>
