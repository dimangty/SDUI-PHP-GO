<line x1="670.0" y1="378" x2="290.0" y2="378" stroke="#5d5b55" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr_resp)"/>
<text x="480.0" y="435" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">POST /api/v1/orders {deliveryAddressId,</text>
<text x="480.0" y="450" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">paymentMethod: CARD}</text>
<line x1="290.0" y1="470" x2="670.0" y2="470" stroke="#33393f" stroke-width="1.8" marker-end="url(#arr_req)"/>
<text x="860.0" y="501" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">BEGIN; INSERT order, order_items; UPDATE</text>
<text x="860.0" y="516" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">products SET stock = stock - qty</text>
<line x1="670.0" y1="536" x2="1050.0" y2="536" stroke="#33393f" stroke-width="1.8" marker-end="url(#arr_req)"/>
<text x="860.0" y="567" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#5d5b55" font-weight="normal" text-anchor="middle">COMMIT OK</text>
<line x1="1050.0" y1="587" x2="670.0" y2="587" stroke="#5d5b55" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr_resp)"/>
<text x="480.0" y="618" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#5d5b55" font-weight="normal" text-anchor="middle">201 {orderId, paymentId, status: CREATED}</text>
<line x1="670.0" y1="638" x2="290.0" y2="638" stroke="#5d5b55" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#arr_resp)"/>
