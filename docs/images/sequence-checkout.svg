<text x="480.0" y="1281" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">GET /api/v1/payments/{paymentId}</text>
<line x1="290.0" y1="1301" x2="670.0" y2="1301" stroke="#33393f" stroke-width="1.8" marker-end="url(#arr_req)"/>
<text x="480.0" y="1332" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#5d5b55" font-weight="normal" text-anchor="middle">200 {status: CAPTURED}</text>
