<text x="860.0" y="241" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">INSERT INTO cart_items (cart_id, product_id,</text>
<text x="860.0" y="256" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#14140f" font-weight="normal" text-anchor="middle">qty, price_snapshot)</text>
<line x1="670.0" y1="276" x2="1050.0" y2="276" stroke="#33393f" stroke-width="1.8" marker-end="url(#arr_req)"/>
<text x="860.0" y="307" font-family="DejaVu Sans Mono, Consolas, monospace" font-size="11.8" fill="#5d5b55" font-weight="normal" text-anchor="middle">OK</text>
