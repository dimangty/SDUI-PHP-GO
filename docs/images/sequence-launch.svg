<text x="780.0" y="42" font-family="DejaVu Sans, Verdana, sans-serif" font-size="23" fill="#0f766e" font-weight="bold" text-anchor="middle">Сценарий: запуск приложения, восстановление авторизации и обновление профиля</text>
