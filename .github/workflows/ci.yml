name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [backend-sdui, tools/ops]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go mod tidy -diff
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...
      - name: Run pinned SDUI linters
        if: matrix.module == 'backend-sdui'
        run: go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0 run --config .golangci.yml
      - name: Run pinned backend vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build standalone PHP image and run unit tests and lint
        run: make test-php
      - name: Verify PHP extensions, TLS, runtime pruning and FPM
        run: python3 scripts/test_php_runtime.py --image shopkmp-php-tests

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the frozen business route manifest
        run: python3 scripts/route_matrix.py --check
      - name: Lint the canonical OpenAPI contract
        uses: daveshanley/vacuum-action@v1
        with:
          specFile: backend-yii2/contracts/openapi.yaml
          failSeverity: error
      - name: Validate the root Compose configuration
        run: make compose-config
      - name: Check shared backend trust, recovery and verification overlays
        run: python3 scripts/test_backend_integration.py
      - name: Guard the local-auth dependency graph and historical exceptions
        run: make test-runtime-graph

  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: bff
            context: backend-sdui
            dockerfile: backend-sdui/Dockerfile
          - name: migrate
            context: tools/ops
            dockerfile: deploy/migrate.Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the ${{ matrix.name }} runtime image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  full-stack-integration:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    needs: [go, php, contracts, images]
    timeout-minutes: 120
    env:
      E2E_PROJECT: shopkmp-migrated-e2e
      E2E_PORT: '58095'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend-sdui/go.mod
          cache-dependency-path: |
            backend-sdui/go.sum
            tools/ops/go.sum
      - name: Configure OpenSearch host requirement
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Start the root Yii2 and BFF stack
        timeout-minutes: 40
        run: make integration-up
      - name: Verify the shared edge, PHP business suites, BFF and ops
        timeout-minutes: 40
        run: make integration-check
      - name: Verify live Nginx/FPM trusted peers and signed webhook source boundary
        timeout-minutes: 5
        run: make test-trust-live ENV_FILE=.env.example
      - name: Backend security policy on the exact tested runtime artifacts
        timeout-minutes: 18
        # No runtime rebuild or tag re-resolution between integration and scan.
        # Findings and scanner/report/DB errors all fail this job.
        run: make security-backend ENV_FILE=.env.example SECURITY_PLATFORM=${{ matrix.platform }} SECURITY_OUTPUT=deploy/evidence/security-${{ matrix.arch }}
      - name: Print service logs on failure
        if: failure()
        run: python3 scripts/compose.py --env .env.example --project "$E2E_PROJECT" --verify logs --no-color --tail 300
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-stack-integration-evidence-${{ matrix.arch }}
          path: |
            deploy/evidence/
            !deploy/evidence/security-*/**
          if-no-files-found: ignore
      - name: Upload raw security reports, SBOM, provenance and policy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-security-${{ matrix.arch }}
          path: |
            deploy/evidence/security-${{ matrix.arch }}/*.json
            deploy/evidence/security-${{ matrix.arch }}/*.stdout
            deploy/evidence/security-${{ matrix.arch }}/*.stderr
            deploy/evidence/security-${{ matrix.arch }}/cache/db/metadata.json
            deploy/evidence/security-${{ matrix.arch }}/cache/java-db/metadata.json
          if-no-files-found: error
      - name: Stop the disposable stack
        timeout-minutes: 5
        if: always()
        run: python3 scripts/compose.py --env .env.example --project "$E2E_PROJECT" --verify down --volumes --remove-orphans

  backend-security:
    name: backend-security
    if: always()
    needs: [full-stack-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Require functional and artifact security checks on both architectures
        run: test '${{ needs.full-stack-integration.result }}' = success

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test Android
        env:
          SHOPKMP_RELEASE_SERVER_URL: ${{ vars.SHOPKMP_RELEASE_SERVER_URL }}
        run: ./gradlew testDebugUnitTest koverVerify detektMetadataCommonMain detektAndroidDebug :composeApp:assembleDebug :composeApp:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: shopkmp-android-artifacts
          path: |
            composeApp/build/outputs/apk/**/*.apk
            composeApp/build/outputs/mapping/release/mapping.txt

  ios-framework:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :core:common:iosSimulatorArm64Test :feature:auth:auth-ui:iosSimulatorArm64Test :feature:cart:cart-ui:iosSimulatorArm64Test :composeApp:linkDebugFrameworkIosSimulatorArm64 --no-daemon
